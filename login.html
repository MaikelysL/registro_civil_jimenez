<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Registro Civil Jiménez</title>
  <style>
/* ============================================
   REGISTRO CIVIL MUNICIPAL DE JIMÉNEZ
   LOGIN - NUEVA PALETA Y DISEÑO MEJORADO
   ============================================ */

/* ----- Reset y variables ----- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #0c1c38;
  --primary-dark: #09142a;
  --secondary: #1a5a8c;
  --secondary-hover: #0f4a7a;
  --accent: #f5a623;
  --success: #2ecc71;
  --danger: #e74c3c;
  --gray-bg: #f5f5f0;
  --white: #ffffff;
  --text-dark: #1a1a1a;
  --text-muted: #4a4a4a;
  --border-radius: 16px;
  --shadow: 0 20px 60px rgba(0,0,0,0.15);
  --transition: 0.3s ease;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--gray-bg);
  color: var(--text-dark);
  line-height: 1.6;
  min-height: 100vh;
}

a {
  text-decoration: none;
  color: inherit;
}

/* ============================================
   LOGIN PAGE - FONDO DINÁMICO
   ============================================ */
.login-page {
  background: var(--gray-bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  position: relative;
  overflow: hidden;
}

/* Fondo dinámico con gradiente animado */
.login-page::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: 
    radial-gradient(circle at 20% 80%, rgba(26, 90, 140, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(245, 166, 35, 0.06) 0%, transparent 50%),
    radial-gradient(circle at 40% 40%, rgba(46, 204, 113, 0.04) 0%, transparent 40%);
  animation: gradientShift 20s ease-in-out infinite alternate;
  z-index: 0;
}

@keyframes gradientShift {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); }
  33% { transform: translate(10%, -10%) rotate(120deg) scale(1.1); }
  66% { transform: translate(-10%, 10%) rotate(240deg) scale(0.9); }
  100% { transform: translate(0, 0) rotate(360deg) scale(1); }
}

/* Partículas decorativas */
.login-page::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: 
    radial-gradient(2px 2px at 20px 30px, rgba(12, 28, 56, 0.1), transparent),
    radial-gradient(2px 2px at 40px 70px, rgba(12, 28, 56, 0.08), transparent),
    radial-gradient(2px 2px at 50px 160px, rgba(12, 28, 56, 0.1), transparent),
    radial-gradient(2px 2px at 90px 40px, rgba(12, 28, 56, 0.08), transparent),
    radial-gradient(2px 2px at 130px 80px, rgba(12, 28, 56, 0.1), transparent),
    radial-gradient(2px 2px at 160px 30px, rgba(12, 28, 56, 0.08), transparent),
    radial-gradient(2px 2px at 200px 120px, rgba(12, 28, 56, 0.1), transparent),
    radial-gradient(2px 2px at 250px 50px, rgba(12, 28, 56, 0.08), transparent);
  background-size: 300px 300px;
  animation: sparkle 15s linear infinite;
  z-index: 0;
  opacity: 0.5;
}

@keyframes sparkle {
  0% { background-position: 0 0; }
  100% { background-position: 300px 300px; }
}

/* ============================================
   LOGIN CARD - DISEÑO MEJORADO
   ============================================ */
.login-card {
  background: var(--white);
  max-width: 440px;
  width: 100%;
  padding: 3rem 2.5rem;
  border-radius: var(--border-radius);
  box-shadow: var(--shadow);
  text-align: center;
  position: relative;
  z-index: 1;
  animation: cardFadeIn 0.8s ease;
  border-top: 6px solid var(--secondary);
}

@keyframes cardFadeIn {
  from { 
    opacity: 0; 
    transform: translateY(30px) scale(0.95);
  }
  to { 
    opacity: 1; 
    transform: translateY(0) scale(1);
  }
}

.login-card .logo-icon {
  font-size: 3.5rem;
  color: var(--accent);
  display: block;
  margin-bottom: 0.5rem;
  background: rgba(245, 166, 35, 0.1);
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 0.8rem;
  transition: all var(--transition);
}
.login-card .logo-icon:hover {
  transform: scale(1.05) rotate(-5deg);
}

.login-card h2 {
  color: var(--primary);
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 0.3rem;
}

.login-card .subtitle {
  color: var(--text-muted);
  font-size: 0.95rem;
  margin-bottom: 1.8rem;
}

/* ----- FORMULARIO MEJORADO ----- */
.login-card .form-group {
  text-align: left;
  margin-bottom: 1.2rem;
}
.login-card .form-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 0.4rem;
  color: var(--primary);
  font-size: 0.9rem;
}
.login-card .form-group label i {
  color: var(--secondary);
  margin-right: 0.4rem;
}
.login-card .form-group .input-wrapper {
  position: relative;
}
.login-card .form-group input {
  width: 100%;
  padding: 0.8rem 1rem;
  padding-left: 2.8rem;
  border-radius: 30px;
  border: 2px solid #d1d5db;
  font-family: inherit;
  font-size: 0.95rem;
  transition: all var(--transition);
  background: var(--gray-bg);
}
.login-card .form-group input:focus {
  outline: none;
  border-color: var(--secondary);
  background: var(--white);
  box-shadow: 0 0 0 4px rgba(26, 90, 140, 0.1);
}
.login-card .form-group .input-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 1rem;
  opacity: 0.6;
}
.login-card .form-group input:focus + .input-icon,
.login-card .form-group input:focus ~ .input-icon {
  color: var(--secondary);
  opacity: 1;
}

/* Opciones extra (recordar y olvidé contraseña) */
.login-card .form-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 1rem 0 1.5rem;
  font-size: 0.85rem;
}
.login-card .form-options label {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--text-muted);
  cursor: pointer;
}
.login-card .form-options label input[type="checkbox"] {
  accent-color: var(--secondary);
  width: 16px;
  height: 16px;
}
.login-card .form-options a {
  color: var(--secondary);
  font-weight: 500;
  transition: color var(--transition);
}
.login-card .form-options a:hover {
  color: var(--secondary-hover);
  text-decoration: underline;
}

/* ----- BOTÓN MEJORADO ----- */
.login-card .btn-primary {
  width: 100%;
  justify-content: center;
  padding: 0.9rem;
  font-size: 1rem;
  background: var(--secondary);
  color: var(--white);
  border-color: var(--secondary);
  border-radius: 50px;
  font-weight: 600;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  border: none;
  cursor: pointer;
}
.login-card .btn-primary:hover {
  background: var(--secondary-hover);
  border-color: var(--secondary-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(26, 90, 140, 0.3);
}
.login-card .btn-primary:active {
  transform: translateY(0);
}

/* ----- FOOTER DEL LOGIN ----- */
.login-card .login-footer {
  margin-top: 1.8rem;
  padding-top: 1.5rem;
  border-top: 1px solid #e9edf2;
}
.login-card .login-footer .info-text {
  font-size: 0.8rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
.login-card .login-footer .info-text i {
  color: var(--accent);
}

.login-card .login-footer .social-login {
  display: flex;
  justify-content: center;
  gap: 0.8rem;
  margin-top: 0.8rem;
}
.login-card .login-footer .social-login a {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid #e9edf2;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: all var(--transition);
  font-size: 1rem;
}
.login-card .login-footer .social-login a:hover {
  border-color: var(--secondary);
  color: var(--secondary);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(26, 90, 140, 0.15);
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width: 480px) {
  .login-card {
    padding: 2rem 1.5rem;
    max-width: 100%;
  }
  .login-card h2 {
    font-size: 1.5rem;
  }
  .login-card .logo-icon {
    width: 60px;
    height: 60px;
    font-size: 2.5rem;
  }
  .login-card .form-options {
    flex-direction: column;
    gap: 0.5rem;
    align-items: flex-start;
  }
  .login-card .form-group input {
    padding: 0.7rem 1rem;
    padding-left: 2.5rem;
    font-size: 0.9rem;
  }
}

@media (max-width: 380px) {
  .login-card {
    padding: 1.5rem 1rem;
  }
  .login-card .login-footer .social-login {
    flex-wrap: wrap;
  }
}
</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="login-page">
  <!-- ============================================
       LOGIN CARD MEJORADA
       ============================================ -->
  <div class="login-card" id="loginCard">
    <!-- Logo -->
    <div class="logo-icon">
      <i class="fas fa-gavel"></i>
    </div>
    
    <h2>Registro Civil</h2>
    <p class="subtitle">Municipal · Jiménez</p>
    
    <!-- Formulario -->
    <form id="loginForm" onsubmit="return false;">
      <div class="form-group">
        <label for="usuario"><i class="fas fa-user"></i> Usuario</label>
        <div class="input-wrapper">
          <input type="text" id="usuario" placeholder="Ingresa tu usuario" value="admin" required>
          <span class="input-icon"><i class="fas fa-user"></i></span>
        </div>
      </div>
      
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Ingresa tu contraseña" value="123456" required>
          <span class="input-icon"><i class="fas fa-lock"></i></span>
        </div>
      </div>
      
      <!-- Opciones -->
      <div class="form-options">
        <label>
          <input type="checkbox" checked> Recordarme
        </label>
        <a href="#" onclick="alert('📧 Se ha enviado un enlace para restablecer tu contraseña a tu correo electrónico.')">
          ¿Olvidaste tu contraseña?
        </a>
      </div>
      
      <!-- Botón de ingreso -->
      <button type="button" class="btn-primary" onclick="handleLogin()">
        <i class="fas fa-sign-in-alt"></i> Ingresar al panel
      </button>
    </form>
    
    <!-- Footer -->
    <div class="login-footer">
      <div class="info-text">
        <i class="fas fa-info-circle"></i> Usuario: <strong>admin</strong> · Contraseña: <strong>123456</strong>
      </div>
      <div class="social-login">
        <a href="#" title="Google"><i class="fab fa-google"></i></a>
        <a href="#" title="Microsoft"><i class="fab fa-microsoft"></i></a>
        <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
      </div>
    </div>
  </div>

  <!-- ============================================
       JAVASCRIPT - VALIDACIÓN Y EFECTOS
       ============================================ -->
  <script>
    function handleLogin() {
      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value.trim();
      
      // Validaciones
      if (!usuario) {
        mostrarError('⚠️ Por favor, ingresa tu nombre de usuario.');
        document.getElementById('usuario').focus();
        return;
      }
      
      if (!password) {
        mostrarError('⚠️ Por favor, ingresa tu contraseña.');
        document.getElementById('password').focus();
        return;
      }
      
      if (password.length < 4) {
        mostrarError('⚠️ La contraseña debe tener al menos 4 caracteres.');
        document.getElementById('password').focus();
        return;
      }
      
      // Credenciales de prueba (usuario: admin, contraseña: 123456)
      if (usuario === 'admin' && password === '123456') {
        // Mostrar mensaje de éxito y redirigir
        const btn = document.querySelector('.btn-primary');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
        btn.disabled = true;
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } else {
        // Credenciales incorrectas
        mostrarError('❌ Usuario o contraseña incorrectos. Intenta nuevamente.');
        
        // Limpiar campos y enfocar
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }
    
    function mostrarError(mensaje) {
      // Buscar si ya existe un mensaje de error
      let errorDiv = document.querySelector('.error-message');
      
      if (!errorDiv) {
        errorDiv = document.createElement('div');
        errorDiv.className = 'error-message';
        errorDiv.style.cssText = `
          background: #fee2e2;
          color: #991b1b;
          padding: 0.8rem 1rem;
          border-radius: 30px;
          font-size: 0.85rem;
          margin-bottom: 1rem;
          display: flex;
          align-items: center;
          gap: 0.5rem;
          animation: cardFadeIn 0.3s ease;
        `;
        const form = document.getElementById('loginForm');
        form.insertBefore(errorDiv, form.firstChild);
      }
      
      errorDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${mensaje}`;
      
      // Auto-ocultar después de 5 segundos
      clearTimeout(window.errorTimeout);
      window.errorTimeout = setTimeout(() => {
        if (errorDiv) {
          errorDiv.style.opacity = '0';
          errorDiv.style.transition = 'opacity 0.5s ease';
          setTimeout(() => errorDiv.remove(), 500);
        }
      }, 5000);
    }
    
    // Permitir login con Enter
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const form = document.getElementById('loginForm');
        if (form.contains(e.target)) {
          e.preventDefault();
          handleLogin();
        }
      }
    });
    
    // Efecto de enfoque en los campos
    document.querySelectorAll('.form-group input').forEach(input => {
      input.addEventListener('focus', function() {
        this.closest('.form-group').querySelector('.input-icon').style.color = 'var(--secondary)';
        this.closest('.form-group').querySelector('.input-icon').style.opacity = '1';
      });
      input.addEventListener('blur', function() {
        if (!this.value) {
          this.closest('.form-group').querySelector('.input-icon').style.color = '';
          this.closest('.form-group').querySelector('.input-icon').style.opacity = '';
        }
      });
    });
    
    // Efecto de entrada con animación
    document.addEventListener('DOMContentLoaded', function() {
      const card = document.getElementById('loginCard');
      card.style.animation = 'cardFadeIn 0.8s ease';
    });
  </script>
</body>
</html>
